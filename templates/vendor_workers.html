{% extends "base.html" %}
{% block content %}
<h2>Manage Workers</h2>
<table class="table table-dark">
    <thead><tr><th>Name</th><th>Role</th><th>Email</th></tr></thead>
    <tbody>
    {% for w in workers %}
    <tr><td>{{ w.name }}</td><td>{{ w.role }}</td><td>{{ w.email }}</td></tr>
    {% endfor %}
    </tbody>
</table>
{% endblock %}
